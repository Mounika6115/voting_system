services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-voting_system}
      DB_USER: ${DB_USER:-vote_user}
      DB_PASS: ${DB_PASS:-vote_pass}
      APP_URL: http://localhost:${WEB_PORT:-8080}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-Admin@123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@voting.local}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public:/var/www/html/public
      - ./config:/var/www/html/config
      - ./app:/var/www/html/app
      - ./css:/var/www/html/public/css

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-voting_system}
      MYSQL_USER: ${DB_USER:-vote_user}
      MYSQL_PASSWORD: ${DB_PASS:-vote_pass}
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-vote_user}", "-p${DB_PASS:-vote_pass}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data: